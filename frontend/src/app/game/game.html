<div class="game-page">

  <div class="game-container">

    <h1>BELA</h1>

    <p class="game-subtitle">
      Trenutna igra
    </p>

    @if (players.length === 4) {

      <app-four-player
        [players]="players">
      </app-four-player>

    } @else {

      <p>
        Učitavanje igrača...
      </p>

    }

  </div>

</div>
