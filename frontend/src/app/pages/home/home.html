<div class="home">

  <header class="header">

    <div class="logo">
      BELA
    </div>

    <div class="user-section">

      @if (currentUser) {

        <div class="profile-area">

          <img
            class="profile-image"
            [src]="getProfileImageUrl()"
            [alt]="'Profilna slika korisnika ' + currentUser.username"
            (error)="onProfileImageError($event)"
          >

          <div class="profile-info">

            <span class="username">
              {{ currentUser.username }}
            </span>

            <label class="file-button">
              Odaberi sliku

              <input
                type="file"
                accept="image/jpeg,image/png,image/webp"
                (change)="onFileSelected($event)"
                hidden
              >
            </label>

            @if (selectedFile) {

              <div class="upload-row">

                <small>
                  {{ selectedFile.name }}
                </small>

                <button
                  class="upload-button"
                  type="button"
                  (click)="uploadProfileImage()"
                  [disabled]="uploadingImage"
                >
                  @if (uploadingImage) {
                    Učitavanje...
                  } @else {
                    Učitaj
                  }
                </button>

              </div>

            }

          </div>

          <button
            class="logout-button"
            type="button"
            (click)="logout()"
          >
            Odjava
          </button>

        </div>

      } @else {

        <a routerLink="/login">
          Prijava
        </a>

        <a routerLink="/register">
          Registracija
        </a>

      }

    </div>

  </header>


  <div class="content">

    <h1>BELA</h1>

    <p class="subtitle">
      Odaberi broj igrača
    </p>

    <div class="player-options">

      <!-- 2 IGRAČA -->

      <button
        type="button"
        routerLink="/game-options"
        [queryParams]="{ players: 2 }"
      >
        <span class="number">
          2
        </span>

        <span class="text">
          IGRAČA
        </span>
      </button>


      <!-- 3 IGRAČA -->

      <button
        type="button"
        routerLink="/game-options"
        [queryParams]="{ players: 3 }"
      >
        <span class="number">
          3
        </span>

        <span class="text">
          IGRAČA
        </span>
      </button>


      <!-- 4 IGRAČA -->

      <button
        type="button"
        routerLink="/game-options"
        [queryParams]="{ players: 4 }"
      >
        <span class="number">
          4
        </span>

        <span class="text">
          IGRAČA
        </span>
      </button>

    </div>


    <!-- STATISTIKA -->

    <a
      routerLink="/statistics"
      class="statistics-card"
    >

      <div class="statistics-icon">
        📊
      </div>

      <div class="statistics-content">

        <h2>
          Statistika
        </h2>

        <p>
          Pregled rezultata, pobjeda i statistike igrača
        </p>

      </div>

      <span class="statistics-arrow">
        →
      </span>

    </a>

  </div>

</div>
