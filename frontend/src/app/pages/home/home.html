<div class="home">

  <header class="header">

    <div class="logo">
      BELA
    </div>

    <div class="user-section">

      @if (currentUser) {

        <span class="username">
          {{ currentUser.username }}
        </span>

        <button
          class="logout-button"
          (click)="logout()"
        >
          Odjava
        </button>

      } @else {

        <a routerLink="/login">
          Prijava
        </a>

        <a routerLink="/register">
          Registracija
        </a>

      }

    </div>

  </header>


  <div class="content">

    <h1>BELA</h1>

    <p class="subtitle">
      Odaberi broj igrača
    </p>

    <div class="player-options">

      <!-- 2 IGRAČA -->

      <button
        routerLink="/game-options"
        [queryParams]="{ players: 2 }"
      >
        <span class="number">
          2
        </span>

        <span class="text">
          IGRAČA
        </span>
      </button>


      <!-- 3 IGRAČA -->

      <button
        routerLink="/game-options"
        [queryParams]="{ players: 3 }"
      >
        <span class="number">
          3
        </span>

        <span class="text">
          IGRAČA
        </span>
      </button>


      <!-- 4 IGRAČA -->

      <button
        routerLink="/game-options"
        [queryParams]="{ players: 4 }"
      >
        <span class="number">
          4
        </span>

        <span class="text">
          IGRAČA
        </span>
      </button>

    </div>


    <!-- STATISTIKA -->

    <a
      routerLink="/statistics"
      class="statistics-card"
    >

      <div class="statistics-icon">
        📊
      </div>

      <div class="statistics-content">

        <h2>
          Statistika
        </h2>

        <p>
          Pregled rezultata, pobjeda i statistike igrača
        </p>

      </div>

      <span class="statistics-arrow">
        →
      </span>

    </a>

  </div>

</div>
