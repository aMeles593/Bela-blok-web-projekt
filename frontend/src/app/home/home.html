<div class="home">

  <header class="header">

    <div class="logo">
      BELA
    </div>

    <div class="user-section">

      @if (currentUser) {

        <span class="username">
          {{ currentUser.username }}
        </span>

        <button
          class="logout-button"
          (click)="logout()"
        >
          Odjava
        </button>

      } @else {

        <a routerLink="/login">
          Prijava
        </a>

        <a routerLink="/register">
          Registracija
        </a>

      }

    </div>

  </header>


  <div class="content">

    <h1>BELA</h1>

    <p class="subtitle">
      Odaberi broj igrača
    </p>

    <div class="player-options">

      <button
        routerLink="/players"
        [queryParams]="{ count: 2 }"
      >
        <span class="number">2</span>
        <span class="text">IGRAČA</span>
      </button>

      <button
        routerLink="/players"
        [queryParams]="{ count: 3 }"
      >
        <span class="number">3</span>
        <span class="text">IGRAČA</span>
      </button>

      <button
        routerLink="/players"
        [queryParams]="{ count: 4 }"
      >
        <span class="number">4</span>
        <span class="text">IGRAČA</span>
      </button>

    </div>

  </div>

</div>
